spring:
  application:
    name: springweb
  datasource:
    # url: jdbc:postgresql://localhost:5432/postgres                # for host run
    # url: jdbc:postgresql://pgdb1:5432/postgres                    # for docker run
    url: jdbc:postgresql://pgdb1-external-service:5432/postgres     # for k8s run
    username: postgres
    password: postgrespass
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mappers/*.xml

server:
  servlet:
    context-path: /k8s-springweb
  port: 8080
